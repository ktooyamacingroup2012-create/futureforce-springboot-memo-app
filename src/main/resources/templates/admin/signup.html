<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	
<head>
    <meta charset="UTF-8">
    <title>管理者登録</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
</head>

<body>
    <div class="app-container">
        <div class="container">
            <h1 class="form-title">管理者登録</h1>

            <div class="note-form-card">
                <form th:action="@{/admin/signup}" th:object="${admin}" method="post">
                    <p class="error-message" th:if="${errorMessage}" th:text="${errorMessage}"
                       style="padding: 1rem 1.5rem 0;"></p>

                    <div class="form-group">
                        <label for="lastName">姓</label>
                        <input type="text" id="lastName" name="lastName" th:value="*{lastName}" required>
                    </div>
                    <div class="form-group">
                        <label for="firstName">名</label>
                        <input type="text" id="firstName" name="firstName" th:value="*{firstName}" required>
                    </div>
                    <div class="form-group">
                        <label for="email">メールアドレス</label>
                        <input type="email" id="email" name="email" th:value="*{email}" required>
                    </div>
                    <div class="form-group">
                        <label for="password">パスワード</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <div class="form-button-container">
                        <a th:href="@{/admin/signin}" class="btn btn-outline">
                            <i class="ri-login-box-line"></i>ログイン画面へ
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="ri-user-add-line"></i>登録
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
